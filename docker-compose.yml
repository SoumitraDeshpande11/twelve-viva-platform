services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twelve
      POSTGRES_USER: twelve
      POSTGRES_PASSWORD: twelve
    ports:
      - "5432:5432"
    volumes:
      - twelve_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - twelve_redis:/data

volumes:
  twelve_postgres:
  twelve_redis:
